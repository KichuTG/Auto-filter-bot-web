<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Search</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body {
      background: #f9fafb;
    }
    .file-card {
      @apply p-4 bg-white rounded-2xl shadow-md hover:shadow-lg transition;
    }
    .file-link {
      @apply text-blue-600 hover:underline font-semibold;
    }
  </style>
</head>
<body class="font-sans">
  <div class="container mx-auto p-6">
    <h1 class="text-3xl font-bold text-center mb-6">Telegram File Search</h1>
    <div class="mb-6">
      <input id="searchInput" type="text" placeholder="Search files..."
        class="w-full p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500" />
    </div>
    <div id="results" class="space-y-4"></div>
  </div>

  <script>
    async function searchFiles(query) {
      const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
      const data = await res.json();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (data.length === 0) {
        resultsDiv.innerHTML = '<p class="text-center text-gray-500">No files found.</p>';
        return;
      }

      data.forEach(file => {
        const qualityMatch = file.file_name.match(/(\d{3,4}p)/i);
        const quality = qualityMatch ? qualityMatch[1] : 'Unknown';
        const sizeGB = (file.file_size / (1024 ** 3)).toFixed(2);

        const div = document.createElement('div');
        div.className = 'file-card';
        div.innerHTML = `
          <a class="file-link" href="https://t.me/YOUR_BOT_USERNAME?start=file_${file.file_id}" target="_blank">${file.file_name}</a>
          <p class="text-sm text-gray-700">Size: ${sizeGB} GB</p>
          <p class="text-sm text-gray-700">Quality: ${quality}</p>
        `;
        resultsDiv.appendChild(div);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.trim();
      if (query.length > 2) {
        searchFiles(query);
      } else {
        document.getElementById('results').innerHTML = '';
      }
    });
  </script>
</body>
</html>
